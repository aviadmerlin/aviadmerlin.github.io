<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Aviad Merlin</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0b0d">
<link rel="icon" href="assets/favicon/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>
(function () {
  try {
    var t = localStorage.getItem("am-theme");
    if (!t) t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
})();
</script>
</head>
<body>
<canvas class="bg-fx" id="bg-fx" aria-hidden="true"></canvas>

<button type="button" class="icon-btn theme-toggle theme-toggle--floating" aria-label="Toggle color theme" aria-pressed="false">
  <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
</button>

<main id="main">
  <section class="wrap">
    <div class="not-found">
      <p class="eyebrow">404</p>
      <h1>That page doesn't exist.</h1>
      <p class="lede">Let's get you back to somewhere real.</p>
      <div class="btn-row" style="margin-top: 1.5rem;">
        <a href="/" class="btn btn--primary">Back home</a>
        <a href="/#work" class="btn btn--ghost">See the work</a>
      </div>
    </div>
  </section>
</main>
<script src="js/main.js" defer></script>
<script src="js/bg-signals.js" defer></script>
</body>
</html>
